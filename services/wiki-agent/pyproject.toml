[project]
name = "wiki-agent"
version = "0.1.0"
description = "A self-improving LLM wiki based on Andrej Karpathy's LLM Wiki gist — wiki-agent service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "mypy>=1.13.0",
    "pylint>=3.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
